# ==============================================================================
# Higress AI Gateway 通过宿主机 Kong 网关对外暴露的 HTTPRoute
# ==============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: higress-gateway-kong-route
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
  annotations:
    konghq.com/read-timeout: "600000"
    konghq.com/write-timeout: "600000"
    konghq.com/connect-timeout: "60000"
spec:
  parentRefs:
    - name: kong-main-gateway
      namespace: default
  hostnames:
    - higress.jppwl.asia
  rules:
    # 🎯 对外暴露标准的 /v1 补全接口与 /health 探活接口
    - matches:
        - path:
            type: PathPrefix
            value: /v1
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        - name: higress-gateway
          port: 8080
          weight: 100
