# ==============================================================================
# OpenAI 标准协议对外接入 HTTPRoute 声明清单
# ==============================================================================
# 业务背景与架构说明:
# 1. 对外标准化暴露 POST /v1/chat/completions 和 GET /v1/models;
# 2. 挂载探针 GET /health 供上层负载均衡器 (OCI ALB) 进行秒级健康探测;
# 3. 关联至 higress-gateway, 请求进入后由绑定的 ai-proxy 插件进行上下文解析与协议翻译.
# ==============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: higress-openai-api-route
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
spec:
  parentRefs:
    - name: higress-gateway
      namespace: higress-system
  rules:
    - matches:
        # 标准补全接口 (支持普通与流式 SSE)
        - path:
            type: PathPrefix
            value: /v1/chat/completions
        # 模型目录检索接口
        - path:
            type: Exact
            value: /v1/models
        # 网关探活与就绪探针接口
        - path:
            type: PathPrefix
            value: /health
      backendRefs:
        # 指向网关内部自身监听端口 (由 ai-proxy 插件接管处理)
        - name: higress-gateway
          port: 8080
          weight: 100
