apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: higress-ai-ingress
  namespace: higress-system
  annotations:
    higress.io/destination: "127.0.0.1:80"
spec:
  ingressClassName: higress
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
