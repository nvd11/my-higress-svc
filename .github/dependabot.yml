version: 2
updates:
  # Go modules (wasm 插件 x2 + 后端)
  - package-ecosystem: gomod
    directory: /plugins/finops-audit
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    # higress-group 的 wasm SDK 大版本升级会引入 nottinygc 的 cmalloc 构建问题
    # (v1.x 需要 TinyGo/特定构建标签, 普通 go vet / wasip1 编译会失败),
    # 因此只允许 patch, 禁止 major/minor 自动升级。
    ignore:
      - dependency-name: "github.com/higress-group/proxy-wasm-go-sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "github.com/higress-group/wasm-go"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: gomod
    directory: /plugins/ai-gatekeeper
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
    ignore:
      - dependency-name: "github.com/higress-group/proxy-wasm-go-sdk"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "github.com/higress-group/wasm-go"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: gomod
    directory: /services/dashboard-api
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  # 前端 npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # 基础镜像 (nginx:alpine / node:22-alpine / golang 等)
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /services/dashboard-api
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /plugins/finops-audit
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /plugins/ai-gatekeeper
    schedule:
      interval: monthly
