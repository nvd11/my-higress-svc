name: Backend CI/CD & Image Publish

on:
  push:
    branches:
      - main
    paths:
      - "services/dashboard-api/**"
      - ".github/workflows/backend-ci-cd.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvd11/my-higress-dashboard-backend
  # 覆盖率下限 (当前实测 55.6%, 先设 50% 防回退, 后续逐步抬升)
  MIN_COVERAGE: "50.0"

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: services/dashboard-api/go.sum

      - name: Go Vet
        run: |
          cd services/dashboard-api
          CGO_ENABLED=0 go vet ./...

      # 用 ./... 而不是硬编码包列表: 新增包自动纳入测试, 改目录名不再误报
      - name: Execute Backend Tests with Coverage
        run: |
          set -euo pipefail
          cd services/dashboard-api
          CGO_ENABLED=0 go test -v -covermode=atomic -coverprofile=coverage.out ./...
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "total coverage: ${total}% (min ${MIN_COVERAGE}%)" | tee -a "$GITHUB_STEP_SUMMARY"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 >= m+0) ? 0 : 1 }' || {
            echo "::error::覆盖率 ${total}% 低于阈值 ${MIN_COVERAGE}%"; exit 1;
          }

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: services/dashboard-api/coverage.out
          retention-days: 14

  build-and-push:
    name: Build, Sign & Push Image
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless (OIDC)

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: services/dashboard-api
          file: services/dashboard-api/Dockerfile
          # 生产只调度到 OCI ARM64 节点 (free-arm-vm), 因此只出 arm64。
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Record manifest digest
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          {
            echo "### Published Higress Dashboard Backend Image"
            echo
            echo '- Repository: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`'
            echo '- Platform: `linux/arm64` (production node: free-arm-vm)'
            echo '- Signed: `cosign keyless`'
            echo '- Manifest digest: `${{ steps.build.outputs.digest }}`'
            echo '- Commit: `${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      # 只在 main 分支 push 时派发; tag (v*) 构建绝不改写生产清单,
      # 避免用旧 commit 的镜像覆盖线上 digest。
      - name: Update GitOps image digest in my-argocd-manifests
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DISPATCH_TOKEN: ${{ secrets.ARGOCD_MANIFESTS_DISPATCH_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "::error::ARGOCD_MANIFESTS_DISPATCH_TOKEN 未配置, 镜像已推送但清单不会更新"
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected manifest digest format: $IMAGE_DIGEST" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --url https://api.github.com/repos/nvd11/my-argocd-manifests/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -n \
              --arg digest "$IMAGE_DIGEST" \
              '{event_type:"update-app-image-digest",client_payload:{svc_name:"higress-dashboard-backend",image_digest:$digest}}')")"

          echo "GitOps dispatch HTTP status: $http_status"
          echo "GitOps digest: $IMAGE_DIGEST"
          if [[ "$http_status" != "204" ]]; then
            cat "$response_file" >&2
            exit 1
          fi
