name: Sync Model Config to GitOps (No Docker Build)

on:
  push:
    branches:
      - main
    paths:
      - "config.yaml"
      - "services/gemini-adapter/config.yaml"
      - ".github/workflows/sync-config.yml"
  workflow_dispatch:

jobs:
  dispatch-config:
    name: Dispatch config.yaml update to my-argocd-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Send repository dispatch to my-argocd-manifests
        env:
          DISPATCH_TOKEN: ${{ secrets.ARGOCD_MANIFESTS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "❌ ARGOCD_MANIFESTS_DISPATCH_TOKEN is missing or empty" >&2
            exit 1
          fi

          CONFIG_B64="$(base64 -w 0 config.yaml)"

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --url https://api.github.com/repos/nvd11/my-argocd-manifests/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -n \
              --arg cfg_b64 "$CONFIG_B64" \
              '{event_type:"update-adapter-config",client_payload:{config_base64:$cfg_b64}}')")"

          echo "GitOps config dispatch HTTP status: $http_status"
          if [[ "$http_status" != "204" ]]; then
            cat "$response_file" >&2
            exit 1
          fi

          echo "🚀 Dispatched update-adapter-config to my-argocd-manifests successfully!"
