name: Sync Model Config to GitOps (No Docker Build)

on:
  push:
    branches:
      - main
    paths:
      - "config.yaml"
      - "services/gemini-adapter/config.yaml"
      - ".github/workflows/sync-config.yml"
  workflow_dispatch:

jobs:
  sync-config:
    name: Sync config.yaml to my-argocd-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Clone my-argocd-manifests repository
        env:
          DISPATCH_TOKEN: ${{ secrets.ARGOCD_MANIFESTS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${DISPATCH_TOKEN}@github.com/nvd11/my-argocd-manifests.git" argocd-repo

      - name: Update config.yaml in higress-gemini-adapter-app.yaml
        run: |
          set -euo pipefail
          TARGET_FILE="argocd-repo/argocd-apps/higress-gemini-adapter-app.yaml"
          
          # 提取当前仓库最新的 config.yaml 内容并加上 14 个空格的标准缩进
          INDENTED_CONFIG="$(sed 's/^/              /' config.yaml)"

          python3 - <<EOF
          import re

          with open("$TARGET_FILE", "r", encoding="utf-8") as f:
              content = f.read()

          with open("config.yaml", "r", encoding="utf-8") as cf:
              raw_cfg = cf.read()

          # 给每一行增加 14 个空格缩进以匹配 helm values 内部嵌套
          indented = "\n".join("              " + line if line.strip() else "" for line in raw_cfg.splitlines())

          # 替换 data 下的 config.yaml: | 块
          pattern = r"(configMap:\s+enabled:\s+true\s+name:\s+higress-gemini-adapter-config\s+data:\s+config\.yaml:\s*\|\n)(?:[ \t]*\n| {14}[^\n]*\n)*"
          replacement = r"\g<1>" + indented + "\n"

          new_content = re.sub(pattern, replacement, content)

          with open("$TARGET_FILE", "w", encoding="utf-8") as f:
              f.write(new_content)

          print("✅ Successfully updated config.yaml in", "$TARGET_FILE")
          EOF

      - name: Commit and push changes
        run: |
          set -euo pipefail
          cd argocd-repo
          if git diff --quiet; then
            echo "ℹ️ No configuration changes detected, nothing to commit."
          else
            git add argocd-apps/higress-gemini-adapter-app.yaml
            git commit -m "feat(gitops): sync config.yaml from my-higress-svc (fast zero-build update)"
            git push origin main
            echo "🚀 Pushed updated config.yaml to my-argocd-manifests successfully!"
          fi
