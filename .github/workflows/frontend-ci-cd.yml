name: Frontend CI/CD & Image Publish

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvd11/my-higress-dashboard-frontend

jobs:
  build-check:
    name: Type Check & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Production build
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build, Sign & Push Frontend Image
    needs: build-check
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless (OIDC)

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          # 生产只调度到 OCI ARM64 节点 (free-arm-vm), 因此只出 arm64。
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Image (keyless)
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"

      - name: Record manifest digest
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
          {
            echo "### Published Higress Dashboard Frontend Image"
            echo
            echo '- Repository: `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}`'
            echo '- Platform: `linux/arm64` (production node: free-arm-vm)'
            echo '- Signed: `cosign keyless`'
            echo '- Manifest digest: `${{ steps.build.outputs.digest }}`'
            echo '- Commit: `${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update GitOps image digest in my-argocd-manifests
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DISPATCH_TOKEN: ${{ secrets.ARGOCD_MANIFESTS_DISPATCH_TOKEN }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "::error::ARGOCD_MANIFESTS_DISPATCH_TOKEN 未配置, 镜像已推送但清单不会更新"
            exit 1
          fi
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unexpected manifest digest format: $IMAGE_DIGEST" >&2
            exit 1
          fi

          response_file="$(mktemp)"
          http_status="$(curl --silent --show-error --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --url https://api.github.com/repos/nvd11/my-argocd-manifests/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$(jq -n \
              --arg digest "$IMAGE_DIGEST" \
              '{event_type:"update-app-image-digest",client_payload:{svc_name:"higress-dashboard-frontend",image_digest:$digest}}')")"

          echo "GitOps dispatch HTTP status: $http_status"
          echo "GitOps digest: $IMAGE_DIGEST"
          if [[ "$http_status" != "204" ]]; then
            cat "$response_file" >&2
            exit 1
          fi
