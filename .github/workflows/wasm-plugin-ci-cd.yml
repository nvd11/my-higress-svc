name: Wasm Plugin CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - "plugins/finops-audit/**"
      - "wasm-plugin.yaml"
      - "config.yaml"
      - ".github/workflows/wasm-plugin-ci-cd.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "plugins/finops-audit/**"
      - "config.yaml"
  workflow_dispatch:

concurrency:
  group: wasm-plugin-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Regenerate Pricing Table from config.yaml
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go run internal/pricinggen/main.go -config ../../config.yaml -out pkg/finops/pricing_gen.go

      - name: Verify Generated Pricing Is In Sync With config.yaml
        run: |
          if ! git diff --exit-code plugins/finops-audit/pkg/finops/pricing_gen.go; then
            echo "::error::pkg/finops/pricing_gen.go 与 config.yaml 漂移。请在 plugins/finops-audit 下运行: go run internal/pricinggen/main.go"
            exit 1
          fi

      - name: Execute FinOps Core Unit Tests
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go test -v ./pkg/finops ./internal/chargeconfig

  build-and-deploy:
    name: Build, Publish & GitOps Deploy Wasm Plugin
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Compile Native Wasm Binary via Go 1.24 wasip1
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go run internal/pricinggen/main.go -config ../../config.yaml -out pkg/finops/pricing_gen.go
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o plugin.wasm .
          echo "Wasm binary compiled successfully: $(ls -lh plugin.wasm | awk '{print $5}')"

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finops-audit-wasm
          path: plugins/finops-audit/plugin.wasm

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Wasm OCI Image
        if: github.ref == 'refs/heads/main'
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: plugins/finops-audit
          file: plugins/finops-audit/Dockerfile
          push: true
          tags: |
            ghcr.io/nvd11/higress-finops-audit:latest
            ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}

      - name: GitOps Write-Back (Update wasm-plugin.yaml)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "Updating wasm-plugin.yaml to image tag: ${{ github.sha }}"
          sed -i -E "s|url: oci://ghcr.io/nvd11/higress-finops-audit:.*|url: oci://ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}|g" wasm-plugin.yaml

          if ! git diff --quiet wasm-plugin.yaml; then
            echo "Changes detected in wasm-plugin.yaml, committing..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wasm-plugin.yaml
            git commit -m "chore(gitops): bump finops-audit wasm image to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "✅ Successfully updated wasm-plugin.yaml with SHA ${{ github.sha }}"
          else
            echo "No change in wasm-plugin.yaml, skipping git push."
          fi
