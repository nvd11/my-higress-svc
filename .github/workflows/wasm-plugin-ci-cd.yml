name: Wasm Plugin CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - "plugins/**"
      - "wasm-plugin.yaml"
      - "config.yaml"
      - "mcp-bridge.yaml"
      - "ingress.yaml"
      - ".github/workflows/wasm-plugin-ci-cd.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "plugins/**"
      - "wasm-plugin.yaml"
      - "config.yaml"
      - "mcp-bridge.yaml"
      - "ingress.yaml"
  workflow_dispatch:

concurrency:
  group: wasm-plugin-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Unit Tests & Drift Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Regenerate Pricing & Gatekeeper Models from config.yaml
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go run internal/pricinggen/main.go -config ../../config.yaml -out pkg/finops/pricing_gen.go -gatekeeper-out ../ai-gatekeeper/models_gen.go -mcpbridge-out ../../mcp-bridge.yaml -ingress-out ../../ingress.yaml

      - name: Validate WasmPlugin Specifications & VirtualKeys Consistency
        run: |
          python3 -c "
          import re, sys

          with open('wasm-plugin.yaml', 'r') as f:
              content = f.read()

          # 🚨 安全门禁: 仓库里绝不允许出现明文虚拟钥匙 (sk-xxx-higress / sk-xxx-agent)
          leaked = re.findall(r'sk-[a-zA-Z0-9]+-higress-[0-9]{8}-[a-zA-Z0-9]+', content)
          if leaked:
              print('❌ SECURITY: 检测到明文 Virtual Key 落库, 必须迁至 OCI Vault!')
              for k in set(leaked):
                  print('   leaked:', k[:14] + '...' + k[-6:])
              sys.exit(1)

          docs = content.split('---')
          plugins = {}
          for doc in docs:
              name_match = re.search(r'name:\s*([a-zA-Z0-9_-]+)', doc)
              if name_match:
                  plugins[name_match.group(1)] = doc

          assert 'ai-gatekeeper' in plugins, 'ai-gatekeeper missing in wasm-plugin.yaml'
          assert 'finops-audit' in plugins, 'finops-audit missing in wasm-plugin.yaml'

          for pname, doc in plugins.items():
              strat_match = re.search(r'failStrategy:\s*([a-zA-Z0-9_-]+)', doc)
              if strat_match:
                  strat = strat_match.group(1)
                  assert strat in ['FAIL_OPEN', 'FAIL_CLOSE'], f'Illegal failStrategy {strat} in {pname}!'

          # virtual_keys 真源已迁至 Secret, 此处只校验占位字段存在
          for pname in ('ai-gatekeeper', 'finops-audit'):
              assert 'virtual_keys:' in plugins[pname], f'{pname} 缺少 virtual_keys 占位字段!'
          print('✅ WasmPlugin 规格校验通过; Virtual Keys 由 OCI Vault 注入, 仓库无明文泄露。')
          "

      - name: Execute FinOps Audit Unit Tests
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go test -v ./...

      - name: Execute AI Gatekeeper Unit Tests
        run: |
          cd plugins/ai-gatekeeper
          CGO_ENABLED=0 go test -v ./...

  build-and-deploy:
    name: Build, Publish & GitOps Deploy Wasm Plugins
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Compile Native Wasm Binaries via Go 1.24 wasip1
        run: |
          echo "Compiling finops-audit..."
          cd plugins/finops-audit
          CGO_ENABLED=0 go run internal/pricinggen/main.go -config ../../config.yaml -out pkg/finops/pricing_gen.go -gatekeeper-out ../ai-gatekeeper/models_gen.go -mcpbridge-out ../../mcp-bridge.yaml -ingress-out ../../ingress.yaml
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o plugin.wasm .
          echo "finops-audit Wasm: $(ls -lh plugin.wasm | awk '{print $5}')"

          echo "Compiling ai-gatekeeper..."
          cd ../ai-gatekeeper
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o plugin.wasm .
          echo "ai-gatekeeper Wasm: $(ls -lh plugin.wasm | awk '{print $5}')"

      - name: Upload Wasm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: higress-wasm-plugins
          path: |
            plugins/finops-audit/plugin.wasm
            plugins/ai-gatekeeper/plugin.wasm

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push finops-audit Wasm OCI Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: plugins/finops-audit
          file: plugins/finops-audit/Dockerfile
          push: true
          tags: |
            ghcr.io/nvd11/higress-finops-audit:latest
            ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}

      - name: Build and Push ai-gatekeeper Wasm OCI Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: plugins/ai-gatekeeper
          file: plugins/ai-gatekeeper/Dockerfile
          push: true
          tags: |
            ghcr.io/nvd11/higress-ai-gatekeeper:latest
            ghcr.io/nvd11/higress-ai-gatekeeper:${{ github.sha }}

      - name: GitOps Write-Back (Update wasm-plugin.yaml & Generated Go Code)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "Updating wasm-plugin.yaml to commit tag: ${{ github.sha }}"
          sed -i -E "s|url: oci://ghcr.io/nvd11/higress-finops-audit:.*|url: oci://ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}|g" wasm-plugin.yaml
          sed -i -E "s|url: oci://ghcr.io/nvd11/higress-ai-gatekeeper:.*|url: oci://ghcr.io/nvd11/higress-ai-gatekeeper:${{ github.sha }}|g" wasm-plugin.yaml

          # Track wasm-plugin.yaml, ingress.yaml, mcp-bridge.yaml and freshly generated Go models/pricing
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm-plugin.yaml mcp-bridge.yaml ingress.yaml plugins/finops-audit/pkg/finops/pricing_gen.go plugins/ai-gatekeeper/models_gen.go

          if ! git diff --cached --quiet; then
            echo "Changes detected in wasm-plugin.yaml, ingress.yaml, mcp-bridge.yaml or generated Go code, committing..."
            git commit -m "chore(gitops): sync topology, pricing and bump wasm images to ${{ github.sha }} [skip ci]"
            git push origin main
            echo "✅ Successfully synced GitOps repo with SHA ${{ github.sha }}"
          else
            echo "No change detected, skipping git push."
          fi
