name: Wasm Plugin CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - "plugins/**"
      - "wasm-plugin.yaml"
      - "config.yaml"
      - "scripts/gen-pricing.sh"
      - "mcp-bridge.yaml"
      - "ingress.yaml"
      - ".github/workflows/wasm-plugin-ci-cd.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "plugins/**"
      - "wasm-plugin.yaml"
      - "config.yaml"
      - "scripts/gen-pricing.sh"
      - "mcp-bridge.yaml"
      - "ingress.yaml"
  workflow_dispatch:

concurrency:
  group: wasm-plugin-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  FINOPS_IMAGE: ghcr.io/nvd11/higress-finops-audit
  GATEKEEPER_IMAGE: ghcr.io/nvd11/higress-ai-gatekeeper

jobs:
  sync-generated:
    name: Sync Generated Artifacts to Git
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Regenerate Pricing & Gatekeeper Models from config.yaml
        run: bash scripts/gen-pricing.sh

      - name: Commit and push generated artifacts
        run: |
          set -euo pipefail
          FILES="plugins/finops-audit/pkg/finops/pricing_gen.go plugins/ai-gatekeeper/models_gen.go mcp-bridge.yaml ingress.yaml"
          # shellcheck disable=SC2086
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard -- $FILES)" ]; then
            echo "✅ 生成物已是最新, 无需回写"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2086
          git add $FILES
          git commit -m "chore(gitops): regenerate artifacts from config.yaml [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ 生成物已回写 main"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/3), rebasing onto origin/main..."
            git pull --rebase --autostash origin main || { git rebase --abort || true; }
            sleep $(( attempt * 5 ))
          done
          echo "::error::生成物回写失败: 3 次 push 均被拒绝"
          exit 1

  test:
    name: Unit Tests & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 与 backend (services/dashboard-api) 统一为 1.26, 消除工具链双版本
          go-version: '1.26'
          cache-dependency-path: |
            plugins/finops-audit/go.sum
            plugins/ai-gatekeeper/go.sum

      - name: Regenerate Pricing & Gatekeeper Models from config.yaml
        run: bash scripts/gen-pricing.sh

      # 生成物由 sync-generated job 自动回写 main；
      # 这里重新生成只为确保 test 使用最新产物。
      - name: Secret Scan (whole repo)
        run: python3 scripts/secret-scan.py

      - name: Validate WasmPlugin Specifications
        run: |
          python3 - <<'PY'
          import re, sys

          with open('wasm-plugin.yaml') as f:
              content = f.read()

          docs = content.split('---')
          plugins = {}
          for doc in docs:
              m = re.search(r'name:\s*([a-zA-Z0-9_-]+)', doc)
              if m:
                  plugins.setdefault(m.group(1), []).append(doc)

          for name in ('ai-gatekeeper', 'finops-audit'):
              assert name in plugins, f'{name} missing in wasm-plugin.yaml'
              assert len(plugins[name]) == 1, f'{name} 重复定义'
              doc = plugins[name][0]
              strat = re.search(r'failStrategy:\s*([A-Za-z0-9_-]+)', doc)
              assert strat, f'{name} 缺少 failStrategy'
              assert strat.group(1) in ('FAIL_OPEN', 'FAIL_CLOSE'), \
                  f'Illegal failStrategy {strat.group(1)} in {name}'
              assert 'virtual_keys:' in doc, f'{name} 缺少 virtual_keys 占位字段'
              url = re.search(r'url:\s*(oci://\S+)', doc)
              assert url, f'{name} 缺少 image url'
              ref = url.group(1)
              assert ':latest' not in ref, \
                  f'{name} 禁止使用 :latest, 必须钉死 commit SHA (可回滚/可追溯)'
              if '@sha256:' in ref:
                  assert re.search(r'@sha256:[a-f0-9]{64}$', ref), \
                      f'{name} digest 格式非法'
              else:
                  tag = ref.rsplit(':', 1)[-1]
                  assert re.fullmatch(r'[a-f0-9]{40}', tag), \
                      f'{name} image tag 必须是 40 位 commit SHA, 实际为 {tag!r}'

          print('✅ WasmPlugin 规格校验通过 (failStrategy 合法 / virtual_keys 占位存在 / 镜像钉死 SHA)')
          PY

      - name: Go Vet
        run: |
          (cd plugins/finops-audit && CGO_ENABLED=0 go vet ./...)
          (cd plugins/ai-gatekeeper && CGO_ENABLED=0 go vet ./...)

      - name: Execute FinOps Audit Unit Tests
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go test -v ./...

      - name: Execute AI Gatekeeper Unit Tests
        run: |
          cd plugins/ai-gatekeeper
          CGO_ENABLED=0 go test -v ./...

  build-and-deploy:
    name: Build, Publish, Sign & GitOps Deploy Wasm Plugins
    runs-on: ubuntu-latest
    needs: [sync-generated, test]
    if: always() && needs.test.result == 'success' && (needs.sync-generated.result == 'success' || needs.sync-generated.result == 'skipped')
    permissions:
      contents: write
      packages: write
      id-token: write   # cosign keyless (OIDC)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            plugins/finops-audit/go.sum
            plugins/ai-gatekeeper/go.sum

      # 生成物由 sync-generated job 回写 main；
      # 这里再生成一次，确保编译用的产物与 config.yaml 完全一致。
      - name: Regenerate Pricing & Gatekeeper Models from config.yaml
        run: bash scripts/gen-pricing.sh

      - name: Compile Native Wasm Binaries via Go wasip1
        run: |
          set -euo pipefail
          echo "Compiling finops-audit..."
          cd plugins/finops-audit
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o plugin.wasm .
          echo "finops-audit Wasm: $(ls -lh plugin.wasm | awk '{print $5}')"

          echo "Compiling ai-gatekeeper..."
          cd ../ai-gatekeeper
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -buildvcs=false -o plugin.wasm .
          echo "ai-gatekeeper Wasm: $(ls -lh plugin.wasm | awk '{print $5}')"

      - name: Upload Wasm Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: higress-wasm-plugins
          path: |
            plugins/finops-audit/plugin.wasm
            plugins/ai-gatekeeper/plugin.wasm

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push finops-audit Wasm OCI Image
        id: finops
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: plugins/finops-audit
          file: plugins/finops-audit/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.FINOPS_IMAGE }}:latest
            ${{ env.FINOPS_IMAGE }}:${{ github.sha }}

      - name: Build and Push ai-gatekeeper Wasm OCI Image
        id: gatekeeper
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: plugins/ai-gatekeeper
          file: plugins/ai-gatekeeper/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.GATEKEEPER_IMAGE }}:latest
            ${{ env.GATEKEEPER_IMAGE }}:${{ github.sha }}

      - name: Install Cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign Published Images (keyless)
        if: github.ref == 'refs/heads/main'
        env:
          FINOPS_DIGEST: ${{ steps.finops.outputs.digest }}
          GATEKEEPER_DIGEST: ${{ steps.gatekeeper.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${FINOPS_IMAGE}@${FINOPS_DIGEST}"
          cosign sign --yes "${GATEKEEPER_IMAGE}@${GATEKEEPER_DIGEST}"

      # GitOps 回写只做一件事: 把镜像钉到本次 commit SHA。
      # 生成物绝不在此提交 (已由 test job 强制要求随 PR 提交), 因此不存在
      # "新配置 + 旧产物" 的同步窗口, 也不会有 bot 覆盖手写内容的风险。
      - name: GitOps Write-Back (pin image SHA only)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          sed -i -E "s|url: oci://ghcr.io/nvd11/higress-finops-audit:.*|url: oci://ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}|g" wasm-plugin.yaml
          sed -i -E "s|url: oci://ghcr.io/nvd11/higress-ai-gatekeeper:.*|url: oci://ghcr.io/nvd11/higress-ai-gatekeeper:${{ github.sha }}|g" wasm-plugin.yaml

          if git diff --quiet -- wasm-plugin.yaml; then
            echo "wasm-plugin.yaml 已指向 ${{ github.sha }}, 无需回写"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wasm-plugin.yaml
          git commit -m "chore(gitops): pin wasm images to ${{ github.sha }} [skip ci]"

          # 并发 push 竞态防护: 非快进则 rebase 后重试 (最多 3 次)
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "✅ wasm-plugin.yaml pinned to ${{ github.sha }}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/3), rebasing onto origin/main..."
            git pull --rebase --autostash origin main || { git rebase --abort || true; }
            sleep $(( attempt * 5 ))
          done
          echo "::error::GitOps 回写失败: 3 次 push 均被拒绝, wasm-plugin.yaml 未更新 (镜像已推送但未上线)"
          exit 1

  smoke:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: github.ref == 'refs/heads/main' && vars.SMOKE_BASE_URL != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Wait for ArgoCD sync & probe gateway contract
        env:
          BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          EXPECTED_MODELS: ${{ vars.SMOKE_EXPECTED_MODELS || '10' }}
        run: bash scripts/smoke.sh
