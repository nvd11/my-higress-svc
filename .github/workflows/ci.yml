name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Execute FinOps Core Unit Tests
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go test -v ./pkg/finops

  build-wasm:
    name: Build & Publish WebAssembly Plugin
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24 for Native Wasm Build
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Compile Native Wasm Binary (wasip1/c-shared)
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 GOOS=wasip1 GOARCH=wasm go build -buildmode=c-shared -o plugin.wasm .
          echo "Wasm binary compiled successfully: $(ls -lh plugin.wasm | awk '{print $5}')"

      - name: Install wasi-stub
        run: cargo install wasi-stub

      - name: Stub Unsupported WASI Imports for Envoy Runtime
        run: |
          cd plugins/finops-audit
          funcs=(
            sched_yield
            poll_oneoff
            path_filestat_get
            path_open
            fd_fdstat_get
            fd_fdstat_set_flags
            fd_prestat_get
            fd_prestat_dir_name
            fd_close
            fd_read
          )
          for f in "${funcs[@]}"; do
            echo "Stubbing wasi_snapshot_preview1:$f"
            wasi-stub plugin.wasm --stub-function wasi_snapshot_preview1:"$f" -o plugin-tmp.wasm
            mv plugin-tmp.wasm plugin.wasm
          done
          echo "Wasm binary stubbed successfully: $(ls -lh plugin.wasm | awk '{print $5}')"
          
      - name: Verify WASI Imports in Wasm Binary
        run: |
          sudo apt-get update && sudo apt-get install -y wabt
          cd plugins/finops-audit
          echo "Listing all imports in stubbed plugin.wasm:"
          wasm-objdump -j Import -x plugin.wasm
          if wasm-objdump -j Import -x plugin.wasm | grep -E "sched_yield|poll_oneoff|path_filestat_get|path_open|fd_fdstat_get|fd_prestat_get"; then
            echo "ERROR: Unsupported WASI symbols still present in plugin.wasm!"
            exit 1
          fi
          echo "SUCCESS: All unsupported WASI symbols were stubbed cleanly!"

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finops-audit-wasm
          path: plugins/finops-audit/plugin.wasm

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Wasm OCI Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: plugins/finops-audit
          file: plugins/finops-audit/Dockerfile
          push: true
          tags: |
            ghcr.io/nvd11/higress-finops-audit:latest
            ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}
