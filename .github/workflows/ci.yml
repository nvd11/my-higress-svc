name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Execute FinOps Core Unit Tests
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go test -v ./pkg/finops

  build-wasm:
    name: Build & Publish WebAssembly Plugin
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.33.0'

      - name: Compile Wasm Binary
        run: |
          cd plugins/finops-audit
          tinygo build -o plugin.wasm -target=wasi -gc=custom -tags="custom_malloc" .
          echo "Wasm binary compiled successfully: $(ls -lh plugin.wasm | awk '{print $5}')"

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finops-audit-wasm
          path: plugins/finops-audit/plugin.wasm

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Wasm OCI Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: plugins/finops-audit
          file: plugins/finops-audit/Dockerfile
          push: true
          tags: |
            ghcr.io/nvd11/higress-finops-audit:latest
            ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}
