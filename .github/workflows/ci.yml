name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: plugins/finops-audit/go.sum

      - name: Execute FinOps Core Unit Tests
        run: |
          cd plugins/finops-audit
          CGO_ENABLED=0 go test -v ./pkg/finops

  build-wasm:
    name: Build & Publish WebAssembly Plugin
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile Native Wasm Binary via TinyGo
        run: |
          docker run --rm -v ${{ github.workspace }}/plugins/finops-audit:/src -w /src tinygo/tinygo:latest tinygo build -o plugin.wasm -scheduler=none -target=wasi -gc=custom -tags="custommalloc nottinygc_finalizer proxy_wasm_version_0_2_100" .
          echo "Wasm binary compiled successfully: $(ls -lh plugins/finops-audit/plugin.wasm | awk '{print $5}')"
          
      - name: Verify WASI Imports in Wasm Binary
        run: |
          sudo apt-get update && sudo apt-get install -y wabt
          cd plugins/finops-audit
          echo "Listing all imports in TinyGo plugin.wasm:"
          wasm-objdump -j Import -x plugin.wasm

      - name: Upload Wasm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: finops-audit-wasm
          path: plugins/finops-audit/plugin.wasm

      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Wasm OCI Image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: plugins/finops-audit
          file: plugins/finops-audit/Dockerfile
          push: true
          tags: |
            ghcr.io/nvd11/higress-finops-audit:latest
            ghcr.io/nvd11/higress-finops-audit:${{ github.sha }}
