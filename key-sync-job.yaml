# ==============================================================================
# Higress 上游 Provider 密钥 + 网关 Virtual Keys 注入 Job (ArgoCD PostSync Hook)
# ==============================================================================
# 业务背景与教训:
#   1. config.yaml 是唯一真源, pricinggen 为每个 provider 生成一条直连 Ingress;
#   2. 上游真实 Key 绝不落 Git, WasmPlugin 里只写 __ENV_KEY__ 占位符;
#   3. ⚠️ 曾尝试用 higress.io/request-header-control-update 注解注入, 实测无效:
#      higress-core 无 Console 部署时 header-control 插件默认未启用, 注解被静默忽略
#      (导致 A6 直连一直 401)。因此改为由 ai-gatekeeper 在请求阶段按
#      upstream_keys[provider] 注入 Authorization, 本 Job 只负责回填真实值。
#   4. 本 Job 在每次 ArgoCD 同步后运行; ArgoCD 侧对 WasmPlugin 的 defaultConfig
#      配了 ignoreDifferences, 回填结果不会被 selfHeal 覆盖; Vault 轮换后自动刷新。
#
# ⛔ [ROTATION 2026-11-06 新增]
#   5. 网关 Virtual Keys 改为从 Secret 回填 (此前明文写死在公开仓库, 已泄露):
#      - 真源: OCI Vault shared-secrets-vault/higress-virtual-keys-json
#      - Secret higress-ai-secrets 的 HIGRESS_VIRTUAL_KEYS_JSON 键 (JSON 对象)
#      - 本 Job 把它 merge-patch 进 ai-gatekeeper / finops-audit 的
#        defaultConfig.virtual_keys; Git 中只保留 `virtual_keys: {}` 占位。
#      - 空值保护: Secret 缺该键时跳过, 绝不清空线上现值 (避免 FAIL_CLOSE 全站 401)。
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: higress-provider-key-sync
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-provider-key-sync
    app.kubernetes.io/part-of: my-higress-svc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: higress-provider-key-sync
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-provider-key-sync
    app.kubernetes.io/part-of: my-higress-svc
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["extensions.higress.io"]
    resources: ["wasmplugins"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: higress-provider-key-sync
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-provider-key-sync
    app.kubernetes.io/part-of: my-higress-svc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: higress-provider-key-sync
subjects:
  - kind: ServiceAccount
    name: higress-provider-key-sync
    namespace: higress-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: higress-provider-key-sync
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-provider-key-sync
    app.kubernetes.io/part-of: my-higress-svc
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: higress-provider-key-sync
    spec:
      restartPolicy: Never
      serviceAccountName: higress-provider-key-sync
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: key-sync
          image: alpine/k8s:1.30.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              NS=higress-system
              SECRET=higress-ai-secrets
              PLUGIN=ai-gatekeeper
              rc=0

              # 从 Git 管理的 Ingress 读取"该 provider 需要哪个 Secret 键"
              # (由 pricinggen 依据 config.yaml 的 api_key 自动生成)
              pairs=""
              for ing in $(kubectl -n "$NS" get ingress \
                  -l app.kubernetes.io/part-of=my-higress-svc \
                  -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'); do
                env=$(kubectl -n "$NS" get ingress "$ing" \
                  -o jsonpath='{.metadata.annotations.higress\.io/upstream-key-env}' 2>/dev/null || true)
                [ -z "$env" ] && continue
                provider=$(kubectl -n "$NS" get ingress "$ing" \
                  -o jsonpath='{.metadata.labels.higress\.io/llm-provider}' 2>/dev/null || true)
                [ -z "$provider" ] && { echo "ERROR: Ingress/$ing 缺少 higress.io/llm-provider 标签"; rc=1; continue; }
                val=$(kubectl -n "$NS" get secret "$SECRET" \
                  -o jsonpath="{.data.$env}" 2>/dev/null | base64 -d 2>/dev/null || true)
                if [ -z "$val" ]; then
                  echo "ERROR: Secret/$SECRET 缺少键 $env (Ingress/$ing 需要)"
                  rc=1
                  continue
                fi
                echo "provider $provider <- secret key $env (${#val} bytes)"
                pairs="${pairs}\"${provider}\":\"${val}\","
              done

              # ------------------------------------------------------------------
              # A. 上游 Provider 真实 Key -> WasmPlugin/defaultConfig/upstream_keys
              # ------------------------------------------------------------------
              if [ -z "$pairs" ]; then
                echo "no provider requires upstream key, skip upstream_keys"
              else
                patch="{\"spec\":{\"defaultConfig\":{\"upstream_keys\":{${pairs%,}}}}}"
                if kubectl -n "$NS" patch wasmplugin "$PLUGIN" --type merge -p "$patch" >/dev/null; then
                  echo "WasmPlugin/$PLUGIN upstream_keys updated"
                else
                  echo "ERROR: patch WasmPlugin/$PLUGIN upstream_keys failed"
                  rc=1
                fi
              fi

              # ------------------------------------------------------------------
              # B. [ROTATION] 网关 Virtual Keys -> 两个 WasmPlugin/defaultConfig/virtual_keys
              # ------------------------------------------------------------------
              vk=$(kubectl -n "$NS" get secret "$SECRET" \
                -o jsonpath='{.data.HIGRESS_VIRTUAL_KEYS_JSON}' 2>/dev/null | base64 -d 2>/dev/null || true)
              if [ -n "$vk" ]; then
                for p in ai-gatekeeper finops-audit; do
                  if kubectl -n "$NS" patch wasmplugin "$p" --type merge \
                       -p "{\"spec\":{\"defaultConfig\":{\"virtual_keys\":${vk}}}}" >/dev/null; then
                    echo "WasmPlugin/$p virtual_keys updated"
                  else
                    echo "ERROR: patch WasmPlugin/$p virtual_keys failed"
                    rc=1
                  fi
                done
              else
                echo "WARN: Secret/$SECRET 缺少 HIGRESS_VIRTUAL_KEYS_JSON, 跳过 virtual_keys 回填 (保留线上现值)"
              fi

              exit $rc
