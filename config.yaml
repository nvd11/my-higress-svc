# ==============================================================================
# Higress AI Gateway / Adapter 声明式模型拓扑、渠道与费率配置 (对齐 LiteLLM 规范)
# ==============================================================================
# 支持运行时热加载与环境变量解析 (os.environ/KEY)
# ==============================================================================

model_list:
  # 🛡️ A6 API 渠道: kimi-k3 (对齐原 LiteLLM A6 BBGT 极低商户价: ¥0.0766/1M Input, ¥0.3830/1M Output)
  - model_name: "kimi-k3"
    aliases:
      - "kimi"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "kimi-k3"
    api_key: "os.environ/A6_API_KEY"
    fallback: "gpt-5.6-luna"
    pricing:
      prompt_per_1m: 0.010595
      completion_per_1m: 0.052974
      cache_read_per_1m: 0.010595

  # 🛡️ A6 API 渠道: glm-5.3 (对齐原 LiteLLM A6 BBGT-VIP 实测价: $0.0102/1M Input, $0.032057/1M Output)
  - model_name: "glm-5.3"
    aliases:
      - "glm"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "glm-5.3"
    api_key: "os.environ/A6_API_KEY"
    fallback: "gpt-5.6-luna"
    pricing:
      prompt_per_1m: 0.0102
      completion_per_1m: 0.032057
      cache_read_per_1m: 0.0102

  # ⚡ A6 API 渠道: glm-5.3-flash (轻量推理模型 · 带思维链，max_tokens 建议 ≥512)
  # 商户价实测 (2026-11-21 A6 控制台, 人民币/1M): 输入 ¥0.0389 · 输出 ¥0.1295 · 缓存读 ¥0.0078 · 缓存写 ¥0
  # 折算美元 (fx=7.2300): 输入 0.00538 · 输出 0.017911 · 缓存读 0.001079
  # ⚠️ reasoning 会大量消耗 completion tokens；max_tokens 过小(<=200)会只思考不出正文
  - model_name: "glm-5.3-flash"
    aliases:
      - "glm-flash"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "glm-5.3-flash"
    api_key: "os.environ/A6_API_KEY"
    fallback: "glm-5.3"
    pricing:
      prompt_per_1m: 0.00538
      completion_per_1m: 0.017911
      cache_read_per_1m: 0.001079

  # 👁️ A6 API 渠道: deepseek-v4.1-flash (多模态视觉模型 · opencode vision-translator 极速眼睛)
  # 实测 2026-10-27: OCR 与细节解析极佳，全链路 3.1~5.6s，远快于 hy3
  - model_name: "deepseek-v4.1-flash"
    aliases:
      - "ds-4.1-flash"
      - "deepseek-4.1-flash"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "deepseek-v4.1-flash"
    api_key: "os.environ/A6_API_KEY"
    fallback: "hy3"
    pricing:
      prompt_per_1m: 0.0
      completion_per_1m: 0.0
      cache_read_per_1m: 0.0

  # 👁️ A6 API 渠道: deepseek-v4.1-flash-1017 (多模态视觉模型 · 1017 快照版)
  # 上游官方价目 (2026-11-15 主人提供, 人民币/1M): 输入 ¥0.048038 · 输出 ¥0.192151 · 缓存读 ¥0.000961
  # 折算美元 (fx=7.23): 输入 0.006644 · 输出 0.026577 · 缓存读 0.000133
  - model_name: "deepseek-v4.1-flash-1017"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "deepseek-v4.1-flash-1017"
    api_key: "os.environ/A6_API_KEY"
    fallback: "deepseek-v4.1-flash"
    pricing:
      prompt_per_1m: 0.006644
      completion_per_1m: 0.026577
      cache_read_per_1m: 0.000133

  # ⚡ A6 API 渠道: deepseek-v4-flash-0731 (超长文本高速推理模型 · 实测支持 250k tokens)
  # ⚠️ a6api 未公开单价，pricing 暂记 0，待账单核实后回填
  - model_name: "deepseek-v4-flash-0731"
    aliases:
      - "DeepSeek-V4-Flash-0731"
      - "ds-v4-flash-0731"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "DeepSeek-V4-Flash-0731"
    api_key: "os.environ/A6_API_KEY"
    fallback: "deepseek-v4.1-flash-1017"
    pricing:
      prompt_per_1m: 0.0
      completion_per_1m: 0.0
      cache_read_per_1m: 0.0

  # 👁️ A6 API 渠道: hy3 (多模态视觉模型 · opencode vision-translator 专用)
  # 实测 2026-10-24: 320x120 图 5.2~5.9s；800x600 图 11.8~12.7s；reasoning 0；OCR 准确
  # ⚠️ a6api 未公开单价，pricing 暂记 0，待账单核实后回填
  - model_name: "hy3"
    aliases:
      - "hunyuan3"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "hy3"
    api_key: "os.environ/A6_API_KEY"
    fallback: "glm-5.3"
    pricing:
      prompt_per_1m: 0.0
      completion_per_1m: 0.0
      cache_read_per_1m: 0.0

  # 🛡️ A6 API 渠道: gpt-5.6-luna (对齐原 LiteLLM A6 实测价: $0.0096/1M)
  - model_name: "gpt-5.6-luna"
    aliases:
      - "luna"
      - "gpt-5.6-luna-a6"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "gpt-5.6-luna"
    api_key: "os.environ/A6_API_KEY"
    pricing:
      prompt_per_1m: 0.0096
      completion_per_1m: 0.0096
      cache_read_per_1m: 0.0096

  # 🛡️ A6 API 渠道: DeepSeek V4 Pro
  # 实扣口径 (2026-10-24 对账, A6 控制台 渠道 6038 bbgt-guard, 人民币/1M):
  #   输入 ¥0.006403 · 缓存读 ¥0.000213 · 输出 ¥0.025612 (4× 输入)
  # 折算成美元/1M (fx=7.23): 输入 0.00096 (沿用) · 缓存读 0.0000295 · 输出 0.00354
  # 🛡️ A6 API 渠道: DeepSeek V4 Pro (滚动最新版 · 无日期快照后缀)
  # ⚠️ 单价暂沿用 0813 快照口径，待 A6 账单核实后回填
  - model_name: "deepseek-v4-pro"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "deepseek-v4-pro"
    api_key: "os.environ/A6_API_KEY"
    pricing:
      prompt_per_1m: 0.00096
      completion_per_1m: 0.00354
      cache_read_per_1m: 0.0000295

  - model_name: "deepseek-v4-pro-0813"
    provider: "a6api"
    protocol: "openai"
    upstream_url: "https://api.a6api.com/v1/chat/completions"
    upstream_model: "deepseek-v4-pro-0813"
    api_key: "os.environ/A6_API_KEY"
    pricing:
      prompt_per_1m: 0.00096
      completion_per_1m: 0.00354
      cache_read_per_1m: 0.0000295

  # 🆓 OpenCode Go 订阅渠道 ($10/月, 月度额度上限 $100 等值)
  # 官方 Go 计价口径 (USD / 1M tokens):
  #   input 0.15 · output 0.60 · cache read 0.003
  # ⚠️ 1017 在 UTC 周一~周五 01:00-04:00 / 06:00-10:00 有 2x 高峰乘数,
  #    此处记录基础价; 实际额度消耗以 opencode /usage 为准。
  # ⚠️ 上游 API ID 是 deepseek-v4.1-flash (不带 -1017), -1017 是快照名。
  - model_name: "deepseek-v4.1-flash-1017-oc"
    aliases:
      - "1017-oc"
      - "oc-1017"
    provider: "opencode-go"
    protocol: "openai"
    upstream_url: "https://opencode.ai/inference/go/v1/chat/completions"
    upstream_model: "deepseek-v4.1-flash"
    api_key: "os.environ/OPENCODE_GO_API_KEY"
    pricing:
      prompt_per_1m: 0.15
      completion_per_1m: 0.60
      cache_read_per_1m: 0.003

  # 🆓 OpenCode Go 免费模型 (官方两个口径均为 0)
  # 1M 上下文, 支持图像理解与 reasoning; 限时免费, 随时可能下线。
