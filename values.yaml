# ==============================================================================
# Higress Gateway (higress-core) Helm Values 生产定制配置 (专为 oci-free-arm-vm 调优)
# ==============================================================================
# 业务背景与架构说明:
# 1. 采用官方 higress-core 作为底层 Chart (只包含 Controller、Gateway 与 CRD, 0 冗余 Console);
# 2. 硬性绑定宿主机节点: 必须调度至甲骨文云新加坡节点 free-arm-vm (4C24G ARM64);
# 3. 移除了极易导致内存泄漏与 OOM 的 Redis 响应缓存, 内存配额控制在极度健康的 800MiB;
# 4. 调优流式长连接空闲超时至 600s, 彻底根治 700k+ 超长上下文断流.
# ==============================================================================

global:
  namespace: higress-system
  nodeSelector:
    kubernetes.io/hostname: free-arm-vm

# ------------------------------------------------------------------------------
# 1. Higress Controller (控制面配置)
# ------------------------------------------------------------------------------
controller:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: free-arm-vm
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"

# ------------------------------------------------------------------------------
# 2. Higress Gateway 数据面 (Envoy C++ 代理内核)
# ------------------------------------------------------------------------------
gateway:
  replicas: 1
  nodeSelector:
    kubernetes.io/hostname: free-arm-vm
  resources:
    requests:
      cpu: "200m"
      memory: "128Mi"
    limits:
      cpu: "2000m"
      memory: "800Mi"

  # 暴露 Service 策略 (与 OCI ALB 对接入站)
  service:
    type: LoadBalancer
    ports:
      - name: http2
        port: 8080
        protocol: TCP
        targetPort: 80
        nodePort: 31880

# ------------------------------------------------------------------------------
# 3. 网络传输与空闲超时调优 (防止超长 SSE 流式断开)
# ------------------------------------------------------------------------------
downstream:
  idleTimeout: 600
upstream:
  idleTimeout: 600
