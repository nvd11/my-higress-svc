# ==============================================================================
# 自研 Higress AI 网关双 Wasm 插件编排清单 (路线乙: 第一道门禁 + 第二道旁路审计)
# ==============================================================================
# 架构分工:
# 1. ai-gatekeeper (Priority 900): 内存级硬门禁 (50MB缓冲、多跳ID清洗、Token鉴权、22键模型准入/改写、/v1/models本地直答)
# 2. finops-audit  (Priority 90):  纯净旁路计量 (真实状态码捕获、Token统计、异步写入 VictoriaLogs 与 MySQL 账本)
#
# ⛔ [ROTATION 2026-11-06] 安全事件: 历史上本文件曾明文写死全部 virtual_keys,
#    而本仓库为 PUBLIC, 导致 16 把钥匙在公网裸奔 13 天。
#    现已将 virtual_keys 全部迁出 Git:
#      真源 = OCI Vault (shared-secrets-vault / higress-virtual-keys-json)
#      → ExternalSecret HIGRESS_VIRTUAL_KEYS_JSON
#      → higress-provider-key-sync Job 回填到本文档的 defaultConfig.virtual_keys
#    保留 `virtual_keys: {}` 仅为占位; 切勿再往此文件写任何明文 key!
#
# 📌 [过渡期 · 2026-11-06] 全量 16 个身份采用 **双钥共存 + 名字区分**:
#      旧钥(在用)  sk-<alias>-higress-* / sk-REDACTED-see-OCI-Vault ...
#                  -> alias: <alias>            (沿用, 日志连续)
#      新钥(待命)  sk-<alias>-v2-20261106-*
#                  -> alias: <alias>-v2         (独立别名, 便于区分与灰度)
#      → 迁移期新旧并存零中断; 各 agent 切到 v2 后, 从 map 删除旧钥即完成摘除。
#    共 32 条 (16 旧 + 16 新)。
# ==============================================================================

# --- 第一道防线: ai-gatekeeper ---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: ai-gatekeeper
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
spec:
  phase: AUTHN
  priority: 900
  failStrategy: FAIL_CLOSE
  imagePullPolicy: Always
  url: oci://ghcr.io/nvd11/higress-ai-gatekeeper:49c374b4c6c1a49f9e6857540897a35804115e79
  defaultConfig:
    dashboard_api_url: "http://higress-dashboard-backend.higress-system.svc.cluster.local:4000/api/v1/internal/audit-log"
    # ⚠️ 由 higress-provider-key-sync Job 从 Secret 回填 (明文钥匙永不落 Git)
    virtual_keys: {}

---
# --- 第二道防线: finops-audit ---
apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: finops-audit
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
spec:
  priority: 90
  failStrategy: FAIL_OPEN
  imagePullPolicy: Always
  url: oci://ghcr.io/nvd11/higress-finops-audit:49c374b4c6c1a49f9e6857540897a35804115e79
  defaultConfig:
    dashboard_api_url: "http://higress-dashboard-backend.higress-system.svc.cluster.local:4000/api/v1/internal/audit-log"
    default_fx_rate: 7.2300
    # ⚠️ 由 higress-provider-key-sync Job 从 Secret 回填 (明文钥匙永不落 Git)
    virtual_keys: {}
