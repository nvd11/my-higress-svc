apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: finops-audit
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
spec:
  # 🎯 优先级 90: 排在 ai-proxy (100) 之后执行，完美在 Response 阶段拦截修补 tool_calls！
  priority: 90
  matchRules:
    - ingress:
        - higress-system/higress-ai-ingress
  defaultConfig:
    victoria_logs_url: "http://100.95.20.57:9428/insert/jsonline"
    dashboard_api_url: "http://higress-dashboard-backend.higress-system.svc:4000/api/v1/internal/audit-log"
    default_fx_rate: 7.2300
    virtual_keys:
      "sk-cindy-higress-20261003-888888": "cindy"
      "sk-yui-higress-20261003-777777": "yui"
      "sk-hebe-higress-20261003-999999": "hebe"
      "sk-jayden-production-key": "jayden"
