# ==============================================================================
# OCI Vault ExternalSecret 自动化凭证同步清单
# ==============================================================================
# 业务背景与架构说明:
# 1. 严格遵守 Cindy 安全红线: 绝不将真实 API Key 硬编码或提交进 Git 仓库;
# 2. 完全复用主人集群中现存稳定的 oci-litellm-vault-store (SecretStore);
# 3. 由 Kubernetes External Secrets Operator 自动从甲骨文云 Vault 拉取凭证并写入 etcd;
# 4. 生成的目标 Secret (higress-ai-secrets) 供 ai-proxy WasmPlugin 动态挂载使用.
# ==============================================================================

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: higress-ai-secrets
  namespace: higress-system
  labels:
    app.kubernetes.io/name: higress-ai-gateway
    app.kubernetes.io/part-of: my-higress-svc
spec:
  # 凭证自动定时轮询刷新周期
  refreshInterval: 1h
  secretStoreRef:
    name: oci-litellm-vault-store
    kind: SecretStore
  target:
    name: higress-ai-secrets
    creationPolicy: Owner
  data:
    # 🟢 Google Gemini 官方直连主力老号 Key 3 (无 15 RPM 限制)
    - secretKey: OPENAI_API_KEY_FREE_3
      remoteRef:
        key: litellm-openai-api-key-free-3

    # 🛡️ A6 API 中转渠道 Key (应急保底与推理组)
    - secretKey: A6_API_KEY
      remoteRef:
        key: litellm-a6-api-key

    # 🌕 元衡 API 渠道 Key (Luna 备用双通道)
    - secretKey: META_API_KEY
      remoteRef:
        key: litellm-meta-api-key

    # ❄️ 自主 Agent 凛 Rin 认证 Key
    - secretKey: RIN_API_KEY
      remoteRef:
        key: litellm-rin-api-key

    # 🎀 自主 Agent 结衣 Yui 认证 Key
    - secretKey: YUI_API_KEY
      remoteRef:
        key: litellm-yui-api-key
